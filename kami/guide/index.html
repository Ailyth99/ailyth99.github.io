<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神々の悪戯 · 攻略集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200..900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/snow.png">
<style>
:root{
  --gold:#a97e2f; --gold-dim:#c2a061;
  --ink:#43425e; --muted:#7d7c93;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column}
body{
  font-family:"Noto Serif SC","Yu Mincho","Hiragino Mincho ProN","Noto Serif CJK SC","Songti SC",serif;
  background:#f2f5f5 url("assets/bg-snow.jpg") center / cover no-repeat fixed;
  color:var(--ink);overflow-x:hidden;-webkit-overflow-scrolling:touch;
}

.shell{position:relative;z-index:2;flex:1 0 auto;width:100%;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  padding:24px;gap:6px;text-align:center}

.kicker{letter-spacing:10px;font-size:.8em;color:var(--gold);text-transform:uppercase}
/* 顶部主 logo：Unite Edition 完整标题（已抠透明底） */
.logo{height:180px;margin:2px 0 0;filter:drop-shadow(0 4px 16px rgba(80,90,120,.28))}
.subtitle{color:var(--gold);letter-spacing:8px;font-weight:bold;
  font-size:clamp(16px,2.2vw,22px)}

.entries{display:flex;gap:30px;margin-top:30px;flex-wrap:wrap;justify-content:center}
.entry{
  position:relative;width:320px;height:400px;border-radius:24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-decoration:none;color:var(--ink);cursor:pointer;
  background:rgba(255,255,255,.78);
  border:1px solid #e3dbc4;
  backdrop-filter:blur(10px);
  box-shadow:0 12px 34px rgba(90,80,50,.14);
  transition:transform .28s,box-shadow .28s,border-color .28s;
  overflow:hidden;
}
.entry:hover{transform:translateY(-8px);box-shadow:0 22px 50px rgba(90,80,50,.26);
  border-color:var(--gold-dim)}
.entry .glow{position:absolute;inset:0;border-radius:24px;pointer-events:none;
  background:radial-gradient(circle at 50% 0%,rgba(202,162,74,.16),transparent 62%)}
.entry .logobox{width:88%;height:140px;display:flex;align-items:center;
  justify-content:center;position:relative;z-index:1}
.entry .logoimg{width:100%;max-height:140px;object-fit:contain;
  filter:drop-shadow(0 2px 6px rgba(80,90,120,.18))}
.entry .tag{font-size:.68em;letter-spacing:3px;color:var(--gold-dim);position:relative;z-index:1}
.entry .btn{font-size:.86em;letter-spacing:3px;padding:9px 26px;border-radius:22px;
  border:1px solid var(--gold-dim);color:var(--gold);margin-top:2px;
  background:rgba(255,255,255,.6);position:relative;z-index:1}
.entry .soon{font-size:.74em;letter-spacing:2px;color:#6b6a80;position:relative;z-index:1}
.entry.coming{opacity:.94;cursor:not-allowed;filter:saturate(.6)}
.entry.coming .btn{color:var(--muted);border-color:#d8d2c0;background:transparent}

.hint{position:relative;z-index:3;flex:none;text-align:center;
  font-size:.74em;color:var(--muted);letter-spacing:2px;
  padding:4px 16px 22px}

/* 音乐开关 */
.music{position:fixed;top:18px;right:18px;z-index:5;width:42px;height:42px;padding:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  border-radius:50%;border:1px solid var(--gold-dim);background:rgba(255,255,255,.7);
  color:var(--gold);cursor:pointer;font-size:1.25em;backdrop-filter:blur(6px);
  transition:background .2s,color .2s,border-color .2s}
.music:hover{background:rgba(255,255,255,.95)}
.music .ic{display:block;line-height:1}
/* 关闭状态：音符变淡，整体划一道斜杠 */
.music.off{color:#b9a06a;border-color:#d8d2c0;background:rgba(255,255,255,.5)}
.music.off .ic{opacity:.55}
.music.off::after{content:"";position:absolute;left:-8px;right:-8px;top:50%;
  height:1.5px;margin-top:-.75px;border-radius:1px;pointer-events:none;
  background:#5b5a70;opacity:.8;transform:rotate(-45deg)}

/* 飘雪 */
#snowfall{position:fixed;inset:0;z-index:1;pointer-events:none}
.fl{position:absolute;top:-40px;animation:snow-fall linear infinite}
.fl img{display:block;animation:snow-sway ease-in-out infinite alternate}
@keyframes snow-fall{to{transform:translateY(110vh)}}
@keyframes snow-sway{from{transform:translateX(calc(var(--amp)*-1px))}to{transform:translateX(var(--amp))}}

@media(max-width:700px){
  .entries{flex-direction:column;gap:18px}
  .entry{width:min(300px,88vw);height:320px}
  .logo{height:110px}
  .shell{padding:16px 14px 6px}
  .hint{font-size:.68em;padding:2px 16px 46px}
}
.visitor-badge{position:fixed;right:16px;bottom:14px;z-index:4;line-height:0;opacity:.85;transition:opacity .2s}
.visitor-badge:hover{opacity:1}
.visitor-badge img{height:20px}
</style>
</head>
<body>
<div id="snowfall"></div>
<button class="music off" id="musicBtn" title="播放音乐" aria-label="音乐开关" aria-pressed="false"><span class="ic">♪</span></button>

<div class="shell">
  <div class="kicker">KAMIGAMI NO ASOBI</div>
  <img class="logo" src="assets/unite-logo.png" alt="神々の悪戯">
  <div class="subtitle">攻略集</div>

  <div class="entries">
    <!-- 左：本编（跳第一部站） -->
    <a class="entry" href="kamiaso-kouryaku/index.html">
      <div class="glow"></div>
      <span class="tag">UNITE EDITION</span>
      <div class="logobox"><img class="logoimg" src="assets/honpen.png" alt="神々の悪戯"></div>
      <span class="btn">进入攻略</span>
    </a>

    <!-- 右：InFinite -->
    <a class="entry" href="kamiaso-infinite-kouryaku/index.html">
      <div class="glow"></div>
      <span class="tag">LUDERE DEORUM</span>
      <div class="logobox"><img class="logoimg" src="assets/fd.png" alt="神々の悪戯 InFinite"></div>
      <span class="btn">进入攻略</span>
    </a>
  </div>
</div>

<div class="hint">雪花飘落 · BGM 循环播放 · 点击右上角可开关音乐</div>

<script>
// ---------- 飘雪 ----------
(function(){
  if(matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var layer=document.getElementById('snowfall');
  var n = innerWidth < 700 ? 9 : 18;
  for(var i=0;i<n;i++){
    var fl=document.createElement('div');fl.className='fl';
    var img=document.createElement('img');img.src='assets/snow.png';img.alt='';
    var size=12+Math.random()*24;
    img.style.width=size+'px';img.style.height=size+'px';
    img.style.opacity=(.5+Math.random()*.45).toFixed(2);
    img.style.setProperty('--amp',Math.round(10+Math.random()*28));
    img.style.animationDuration=(2+Math.random()*2.5).toFixed(2)+'s';
    fl.style.left=(Math.random()*100).toFixed(2)+'%';
    fl.style.animationDuration=(9+Math.random()*12).toFixed(2)+'s';
    fl.style.animationDelay=(-Math.random()*20).toFixed(2)+'s';
    fl.appendChild(img);layer.appendChild(fl);
  }
})();

// ---------- BGM（默认自动播放） ----------
(function(){
  var audio = new Audio('assets/bgm.mp3');
  audio.loop = true;
  audio.volume = 0.8;
  audio.preload = 'auto';
  var btn = document.getElementById('musicBtn');
  var hint = document.querySelector('.hint');
  var hintText = hint ? hint.textContent : '';
  var wantSound = true;

  // 图标状态完全跟随 audio 真实状态
  function sync(){
    var on = !audio.paused && !audio.ended;
    btn.classList.toggle('off', !on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.title = !on ? '播放音乐' : (audio.muted ? '点击开启声音' : '关闭音乐');
    if(hint) hint.textContent = (on && audio.muted)
      ? '音乐已静音起播 · 点击页面任意处开启声音' : hintText;
  }
  audio.addEventListener('play', sync);
  audio.addEventListener('pause', sync);
  audio.addEventListener('volumechange', sync);
  sync();

  // 优先有声自动播放；被浏览器拦截则先静音自动播放，等首次交互再解开静音
  function startSound(){
    if(!wantSound) return;
    audio.muted = false;
    var p = audio.play();
    if(p && p.catch) p.catch(function(){
      audio.muted = true;
      var q = audio.play();
      if(q && q.catch) q.catch(function(){ sync(); });
    });
  }
  startSound();

  // 首次交互（点击/触摸/按键）立刻解除静音，让声音正常出来
  function unmute(){
    if(audio.muted && !audio.paused){
      audio.muted = false;
      var p = audio.play();
      if(p && p.catch) p.catch(function(){});
    }
    sync();
  }
  ['pointerdown', 'touchstart', 'keydown'].forEach(function(t){
    document.addEventListener(t, unmute, {once:true, passive:true});
  });

  btn.addEventListener('click', function(e){
    e.stopPropagation();
    if(audio.paused){ wantSound = true; startSound(); }
    else if(audio.muted){ audio.muted = false; var p = audio.play(); if(p && p.catch) p.catch(function(){}); sync(); }
    else { audio.pause(); }
  });
})();

// InFinite 入口已改为 <a> 链接，指向 kamiaso-infinite-kouryaku/index.html
</script>
<a class="visitor-badge" href="https://visitor-badge.laobi.icu" target="_blank" rel="noopener"><img src="https://visitor-badge.laobi.icu/badge?page_id=kamigamiguide&amp;left_text=%E7%A5%9E%20%E3%81%AE%20visitors&amp;left_color=%23dfa4a4&amp;right_color=%23a3f0ef" alt="访客统计" loading="lazy"></a>
</body>
</html>
